<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Leak Monitoring</title>
    <!--
      Applies the saved theme before the first paint.

      Inline and synchronous on purpose: the stylesheet falls back to the OS setting, so a
      user who chose light on a dark-mode machine would otherwise get a full dark render and
      a snap to light once React mounted. Deferring this to the app is too late by a frame.

      The key is duplicated from src/lib/theme.ts because this runs before any module loads;
      the two must be changed together.
    -->
    <script>
      try {
        var t = localStorage.getItem("lm.theme");
        if (t === "light" || t === "dark") {
          document.documentElement.setAttribute("data-theme", t);
        }
      } catch (e) {
        /* Site data blocked — fall through to the OS preference. */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
