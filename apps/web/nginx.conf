server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Proxy the API through the same origin the app is served from.
    #
    # This is the production equivalent of the Vite dev proxy: the browser only ever talks
    # to one origin, so there is no CORS preflight and the session cookie stays first-party.
    # It is also why VITE_API_URL is empty in the image.
    location /api/ {
        # Resolve `api` at request time, not once at startup.
        #
        # With a literal `proxy_pass http://api:5000`, nginx resolves the name when the
        # config loads and caches the address forever. Recreating the API container gives it
        # a new IP and every proxied request then 502s until nginx is restarted too.
        # Putting the host in a variable forces per-request resolution via Docker's embedded
        # DNS, so the stack survives `docker compose up -d api` on its own.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_upstream api;

        # A variable in proxy_pass means nginx no longer appends the matched URI, so pass
        # $request_uri explicitly — otherwise every path collapses to /.
        proxy_pass http://$api_upstream:5000$request_uri;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Server-sent events for live dashboard pushes: no buffering, no read timeout.
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    # SPA history fallback — deep links like /dashboard/leaks must serve index.html
    # rather than 404, or a refresh on any inner route breaks.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed asset filenames are immutable; index.html must never be cached or users get
    # a stale shell pointing at assets that no longer exist.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    server_tokens off;
}
