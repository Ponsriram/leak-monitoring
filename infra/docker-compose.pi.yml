# Override for running just the collection side (redis + tor + worker) on a remote host,
# against a Postgres that already lives elsewhere (e.g. Neon). Use alongside the base file:
#
#   AUTH_SECRET=unused docker compose --env-file .env \
#     -f infra/docker-compose.yml -f infra/docker-compose.pi.yml \
#     --profile full up -d --build redis tor worker
#
# `--env-file .env` is required: without it Compose looks for .env next to the first -f
# file (infra/), not in the repo root, and the worker gets an empty DATABASE_URL.
#
# Compose interpolates every service in the file, including the api this command never
# starts, so the api's required AUTH_SECRET must have a value. The worker never reads it,
# so a placeholder is enough.
#
# Only listing redis/tor/worker keeps postgres and api out of the run entirely, since the
# worker below no longer depends on the local postgres service.
#
# depends_on is a mapping, and Compose deep-merges mappings across -f files rather than
# replacing them — so without `!override` here, the base file's `postgres` dependency
# survives the merge and gets started anyway.

services:
  worker:
    environment:
      DATABASE_URL: ${DATABASE_URL}
    depends_on: !override
      redis:
        condition: service_healthy
      tor:
        condition: service_healthy
