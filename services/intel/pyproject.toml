[project]
name = "intel"
version = "0.1.0"
description = "Collection and extraction pipeline for ransomware leak-site monitoring"
requires-python = ">=3.12"

dependencies = [
    # collection
    "httpx[socks]>=0.28",
    "selectolax>=0.3.27",
    # extraction / validation
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    # storage
    "asyncpg>=0.30",
    # runtime
    "typer>=0.15",
    "structlog>=25.1",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "arq>=0.26",
]

[project.optional-dependencies]
# Browser collector. Needs `playwright install firefox` after syncing.
browser = ["playwright>=1.49"]
# Zero-shot NER. Pulls torch + transformers (~2 GB) — deliberately NOT a base dependency,
# so the pipeline and its tests run without an ML stack. See intel/extract/README.md.
ml = ["gliner>=0.2.28"]

[project.scripts]
intel = "intel.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["intel"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Typer's entire API is `typer.Option(...)` / `typer.Argument(...)` in argument defaults,
# so B008 fires on every command. It is the framework's intended usage, not a mutable
# default-argument bug.
"intel/cli.py" = ["B008"]
