# Monitored sources.
#
#     intel sources sync            # load this file into the database
#     intel sources list --all      # see them and their crawl health
#     intel sources enable <slug>   # start crawling one
#
# ------------------------------------------------------------------------------------------
# EVERY SOURCE SHIPS DISABLED. Syncing does NOT start crawling. Reaching these hosts means
# running Tor and connecting to live criminal infrastructure — a deliberate decision about
# your legal and operational position, not a side effect of loading a config file.
# ------------------------------------------------------------------------------------------
#
# Leak sites rotate addresses and get seized constantly: `consecutive_failures` on each
# source tracks reachability automatically, and the Sources page shows it.
#
# crawl_interval_seconds is the SHALLOW PROBE cadence — one fetch of page 1, which is where
# leak sites append new victims. 900s is affordable precisely because it is one page.
#
# The full walk is separate, on `deep_crawl_interval_seconds` (default 6h), and is what
# catches edits to older entries and pages a failed crawl missed.
#
# collector:        http (fast, no JS) | browser (Playwright, for JS-rendered listings)
# pagination_style: none | query (?page=N) | path (/page/N) | offset (?offset=N)
# item_selector:    optional CSS selector for ONE victim's tile, card or row on the listing,
#                   e.g. "a.blog__card". Leave it out: listings laid out as repeated tiles are
#                   detected on their own, one victim per tile. Set it only for a site where
#                   detection picks the wrong element (check with `intel sources probe`).
#
# Nearly all sources use `collector: http`: `browser` launches Firefox per source and waits
# on page lifecycle events, `http` is one async request. Use `browser` only for a site whose
# listings render client-side and come back empty over HTTP — 3ev4metjiroh (Abyss),
# blogvl7tjyjv, embargo, inc-ransom, j5o5y2feotmh, lynx, ransomhouse (Everest), termite and
# zohlm7ahjweg.
#
# Only sources that actually yield listings belong here. A site that is gated behind a
# CAPTCHA or access queue, has moved or gone down, or turns out not to be a leak site at all
# (a forum, a shop, a file index) is deleted from this file rather than kept switched off —
# then `intel sources sync --prune` removes it from the database too. Its collected leaks
# survive the prune. To check a site before adding it here, see `intel sources probe --help`.
#
# A page 1 that is a DDoS access queue, a human check, a maintenance notice, a login wall or
# near-empty is recorded as a FAILED crawl naming the gate (see `gate_kind` and
# MIN_PAGE_TEXT_CHARS in pipeline.py). The crawler does not solve CAPTCHAs or pass queues;
# a source stuck behind one stays failing until it changes.

