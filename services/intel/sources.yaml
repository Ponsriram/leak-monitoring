# Monitored sources.
#
#     intel sources sync            # load this file into the database
#     intel sources list --all      # see them and their crawl health
#     intel sources enable <slug>   # start crawling one
#
# ------------------------------------------------------------------------------------------
# EVERY SOURCE SHIPS DISABLED. Syncing does NOT start crawling. Reaching these hosts means
# running Tor and connecting to live criminal infrastructure — a deliberate decision about
# your legal and operational position, not a side effect of loading a config file.
# ------------------------------------------------------------------------------------------
#
# Last reachability probe: 2026-08-14 — 83 legacy URLs tested, 30 responded, 53 dead.
# The dead ones were removed. Leak sites rotate addresses and get seized constantly, so
# re-probe periodically: `consecutive_failures` on each source tracks this automatically.
#
# collector:        http (fast, no JS) | browser (Playwright, for JS-rendered listings)
# pagination_style: none | query (?page=N) | path (/page/N) | offset (?offset=N)
#
# Nearly all sources use `collector: http`.
#
# They were originally ALL marked `browser` because the old crawler routed everything through
# Selenium. That was wrong and expensive: the 2026-08-14 probe reached every one of them
# over plain HTTP, while a full `browser` run timed out on six of them (cloak, funksec,
# ijzn3sicrcy7, om6q4a6cyipx, ransomhouse, z3wqggtxft7i) — sites that plain HTTP had just
# fetched successfully.
#
# `browser` launches Firefox per source and waits on page lifecycle events; `http` is one
# async request. Only switch a source back to `browser` if its listings genuinely render
# client-side and come back empty over HTTP.
#
# Ten do, as of 2026-08-17. Each was identified by a specific symptom rather than guessed
# at, and each was verified by running it both ways:
#
#   akira      HTTP 403 on every attempt, while the same address loads in Tor Browser —
#              the site refuses clients that don't execute its challenge.
#   blacksuit  302 to /b/challenge, which then returns 200. Plain HTTP was storing the
#              challenge page and calling it a listing.
#   cloak      302 to /verify_captcha, same story.
#   blogvl7tjyjv, embargo, inc-ransom, j5o5y2feotmh, lynx, termite, zohlm7ahjweg
#              all returned 0 characters of text over HTTP and real listings through
#              Playwright. Switching them found 28 leaks on the first run, including 27
#              from termite that had never been collected at all.
#
# Every one of them had been recorded as a *healthy* crawl while collecting nothing, because
# a page that fetched but held no text counted as a success. It no longer does — see
# MIN_PAGE_TEXT_CHARS in pipeline.py — which is how this list was found.
#
# Two sources still collect nothing and are honest failures rather than hidden ones:
#
#   cloak      serves a CAPTCHA interstitial. A browser reaches it but cannot pass it, and
#              solving it automatically is not something this crawler will do.
#   direwolf   29 characters of text either way. Needs investigating; possibly moved.

